# Attribute dictionary: category (一级分类) → group (二级分类) → attribute (可检索标签).
#
# - Keys are stable identifiers used in URLs and seed files; never rename them casually.
# - domain: appearance | personality | other — decides the section on the character page.
# - featured: true on a group shows its attributes on character cards.
# - swatch: optional display colour (hair / eye / skin colour).
# - parent: optional key of a broader attribute (informational only; search does not expand it).
# - Order in this file is the display order.
#
# Run `python -m app.seed` after editing; the frontend picks up changes automatically.

categories:
  # ───────────────────────────── 外观 ─────────────────────────────
